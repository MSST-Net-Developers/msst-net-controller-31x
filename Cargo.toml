[workspace]
members = ["."]

[package]
name = "msst-net-controller"
version = "3.1.0-alpha.2"
edition = "2024"
description = "MSST-Net Controller — the unprivileged GUI/CLI client."
license = "MIT"

[lib]
name = "msst_net_controller"
path = "src/lib.rs"

[[bin]]
name = "msst-net-controller"
path = "src/main.rs"

[[bin]]
name = "msst-net-webui"
path = "src/bin/msst-net-webui.rs"
required-features = ["webui"]

[features]
default = []
webui = ["dep:axum", "dep:axum-server", "dep:rustls", "dep:rcgen", "dep:argon2", "dep:rand", "dep:ipnetwork", "dep:toml", "dep:rpassword", "dep:rust-embed", "dep:mime_guess", "dep:tower-http", "dep:windows-service"]

[dependencies]
# ── IPC protocol (shared with Core) ──────────────────────────────────────────
msst-ipc-protocol = { path = "../msst-net-core-31x/crates/msst-ipc-protocol" }

# ── Async runtime ────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ───────────────────────────────────────────────────────────
thiserror = "2"

# ── Logging ──────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── CLI ──────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── WebUI backend (optional) ─────────────────────────────────────────────────
# Same security stack as the 3.0.x WebUI (password, sessions, TLS, CIDR allowlist).
axum = { version = "0.8", features = ["ws", "macros"], optional = true }
axum-server = { version = "0.7", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
rcgen = { version = "0.12", optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
ipnetwork = { version = "0.20", optional = true }
toml = { version = "0.8", optional = true }
rpassword = { version = "7", optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
tower-http = { version = "0.6", features = ["compression-gzip"], optional = true }
mime_guess = { version = "2", optional = true }

# ── Platform-specific IPC transport ──────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["full", "net"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["full", "net"] }
# msst-net-webui as a Windows service (same crate and version as Core).
windows-service = { version = "0.6", optional = true }

[dev-dependencies]
tower = "0.5"

[profile.dev]
panic = "abort"

[profile.dev-fast]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false

[profile.release.package."*"]
opt-level = "z"
strip = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false