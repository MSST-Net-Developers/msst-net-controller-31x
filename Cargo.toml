[workspace]
members = [".", "frontend/src-tauri"]

[package]
name = "msst-net-controller"
version = "3.1.0-alpha.1"
edition = "2024"
description = "MSST-Net Controller — the unprivileged GUI/CLI client."

[lib]
name = "msst_net_controller"
path = "src/lib.rs"

[[bin]]
name = "msst-net-controller"
path = "src/main.rs"

[features]
default = []
tauri = ["dep:tauri"]
webui = ["dep:axum", "dep:tower", "dep:tower-http", "dep:futures-util"]

[dependencies]
# ── IPC protocol (shared with Core) ──────────────────────────────────────────
msst-ipc-protocol = { path = "../msst-net-core-31x/crates/msst-ipc-protocol" }

# ── Async runtime ────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ───────────────────────────────────────────────────────────
thiserror = "2"

# ── Logging ──────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── CLI ──────────────────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }

# ── Tauri integration (optional) ─────────────────────────────────────────────
tauri = { version = "2", optional = true }

# ── WebUI backend (optional) ─────────────────────────────────────────────────
axum = { version = "0.8", features = ["ws", "macros"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
futures-util = { version = "0.3", optional = true }

# ── Platform-specific IPC transport ──────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["full", "net"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["full", "net"] }

[dev-dependencies]
tokio-test = "0.4"