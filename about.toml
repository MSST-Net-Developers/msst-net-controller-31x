# cargo-about (scripts/third-party-licenses.py): licenses the Rust
# dependencies may use.  A dependency under any other license fails the
# generation.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "WTFPL",
    "OpenSSL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
